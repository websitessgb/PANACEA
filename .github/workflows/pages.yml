name: Deploy PANACEA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -R . _site/
          rm -rf _site/.git
          rm -rf _site/.github

          # Agregar versión automática a los archivos CSS y JS
          VERSION="${GITHUB_SHA}"

          sed -i "s#styles\.css#styles.css?v=${VERSION}#g" _site/index.html
          sed -i "s#products\.js#products.js?v=${VERSION}#g" _site/index.html
          sed -i "s#app\.js#app.js?v=${VERSION}#g" _site/index.html

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
